apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - postgres/init-configmap.yaml
  - postgres/service.yaml
  - postgres/statefulset.yaml
  - rabbitmq/service.yaml
  - rabbitmq/statefulset.yaml
  - timescaledb/init-configmap.yaml
  - timescaledb/service.yaml
  - timescaledb/statefulset.yaml
  - apps/auth-service.yaml
  - apps/url-service.yaml
  - apps/redirect-service.yaml
  - apps/analytics-service.yaml
  - apps/web.yaml
  - monitoring/prometheus-rbac.yaml
  - monitoring/prometheus-deployment.yaml
  - monitoring/grafana.yaml

images:
  - name: url-service
    newName: ghcr.io/thiranjshan/url-shortener/url-service
    newTag: "sha-645fe4a"
  - name: redirect-service
    newName: ghcr.io/thiranjshan/url-shortener/redirect-service
    newTag: "sha-645fe4a"
  - name: auth-service
    newName: ghcr.io/thiranjshan/url-shortener/auth-service
    newTag: "sha-645fe4a"
  - name: analytics-service
    newName: ghcr.io/thiranjshan/url-shortener/analytics-service
    newTag: "sha-645fe4a"
  - name: web
    newName: ghcr.io/thiranjshan/url-shortener/web
    newTag: "sha-645fe4a"

configMapGenerator:
  - name: prometheus-config
    namespace: url-shortener
    files:
      - prometheus.yml=monitoring/prometheus-scrape-config.yml 
  - name: grafana-datasource
    namespace: url-shortener
    files:
      - monitoring/grafana-datasource.yaml
  - name: grafana-dashboard-provider
    namespace: url-shortener
    files:
      - monitoring/grafana-dashboard-provider.yaml
  - name: grafana-dashboards
    namespace: url-shortener
    files:
      - monitoring/url-shortener-dashboard.json
  