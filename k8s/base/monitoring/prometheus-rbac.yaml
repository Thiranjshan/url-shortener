apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: url-shortener
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-url-shortener
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-url-shortener
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-url-shortener
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: url-shortener