server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Health endpoint for Docker and Kubernetes
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # API: only the endpoints the page needs are exposed
    location = /api/auth/register {
        proxy_pass http://auth-service:3002/register;
    }
    location = /api/auth/login {
        proxy_pass http://auth-service:3002/login;
    }
    location = /api/urls {
        proxy_pass http://url-service:3000/urls;
    }
    location /api/stats/ {
        proxy_pass http://analytics-service:8000/stats/;
    }

    # Metrics are for the monitoring system only, never for the public.
    # Without this rule the path would fall through to redirect-service,
    # which has its own /metrics endpoint.
    location = /metrics {
        return 404;
    }

    # The page itself
    location = / {
        try_files /index.html =404;
    }

    # Any other path: serve a static file if one exists,
    # otherwise treat it as a short code and hand it to redirect-service
    location / {
        try_files $uri @redirect;
    }
    location @redirect {
        proxy_pass http://redirect-service:3001;
    }
}