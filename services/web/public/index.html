<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>URL Shortener</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>URL Shortener</h1>
        <div id="user-bar" hidden>
          <span id="user-email"></span>
          <button id="logout" class="link" type="button">Log out</button>
        </div>
      </header>

      <p id="message" role="status" hidden></p>

      <!-- Shown when signed out -->
      <section id="auth-view" hidden>
        <h2>Sign in</h2>
        <form id="auth-form">
          <label
            >Email
            <input id="email" type="email" required autocomplete="username" />
          </label>
          <label
            >Password (at least 8 characters)
            <input
              id="password"
              type="password"
              required
              minlength="8"
              autocomplete="current-password"
            />
          </label>
          <div class="row">
            <button type="submit">Log in</button>
            <button type="button" id="register" class="secondary">
              Create account
            </button>
          </div>
        </form>
      </section>

      <!-- Shown when signed in -->
      <section id="app-view" hidden>
        <form id="shorten-form">
          <input
            id="long-url"
            type="url"
            placeholder="https://example.com/a/very/long/link"
            required
          />
          <button type="submit">Shorten</button>
        </form>

        <div id="result" hidden>
          <span>Your short link:</span>
          <a id="result-link" target="_blank" rel="noopener"></a>
          <button id="copy" type="button" class="secondary">Copy</button>
        </div>

        <div class="list-header">
          <h2>Your links</h2>
          <button id="refresh" type="button" class="secondary">Refresh</button>
        </div>
        <table>
          <thead>
            <tr>
              <th>Short link</th>
              <th>Original</th>
              <th>Clicks</th>
            </tr>
          </thead>
          <tbody id="links"></tbody>
        </table>
        <p id="empty" hidden>No links yet. Shorten one above.</p>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
